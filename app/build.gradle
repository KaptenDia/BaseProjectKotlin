plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id 'androidx.navigation.safeargs'
    id 'kotlin-parcelize'
    // TODO: Uncomment these after adding google-services.json
    // id 'com.google.gms.google-services'
    // id 'com.google.firebase.crashlytics'
}

android {
    namespace = "com.vascomm.basekotlin"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.vascomm.basekotlin"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Fragment KTX
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // Dagger Hilt
    implementation "com.google.dagger:hilt-android:2.55"
    implementation 'androidx.activity:activity:1.9.3'
    kapt "com.google.dagger:hilt-android-compiler:2.55"

    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:2.8.5"
    implementation "androidx.navigation:navigation-ui-ktx:2.8.5"

    // Android Util
    implementation 'com.blankj:utilcode:1.30.7'

    // Image
    implementation "io.coil-kt:coil:2.4.0"

    // Material Dialog
    implementation "com.afollestad.material-dialogs:core:3.3.0"

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // Security - Encrypted SharedPreferences
    implementation "androidx.security:security-crypto:1.1.0"

    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.11.0'

    // Chucker
    debugImplementation "com.github.chuckerteam.chucker:library:4.1.0"
    releaseImplementation "com.github.chuckerteam.chucker:library-no-op:4.1.0"

    // Leak Canary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // TODO: Uncomment Firebase dependencies after adding google-services.json
    // Firebase BOM (Bill of Materials) - manages Firebase versions
    // implementation platform('com.google.firebase:firebase-bom:34.4.0')
    // Firebase Analytics
    // implementation 'com.google.firebase:firebase-analytics-ktx'
    // Firebase Crashlytics
    // implementation 'com.google.firebase:firebase-crashlytics-ktx'
    // Firebase Cloud Messaging (Push Notifications)
    // implementation 'com.google.firebase:firebase-messaging-ktx'
    // Firebase In-App Messaging (Optional)
    // implementation 'com.google.firebase:firebase-inappmessaging-display-ktx'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
